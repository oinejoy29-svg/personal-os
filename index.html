
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>PERSONAL OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">PERSONAL OS</div>
      <div class="muted" id="today"></div>
    </div>
    <span class="status">LOCAL STORAGE</span>
  </header>

  <main>
    <section class="quick panel">
      <div class="section-head">
        <div>
          <div class="eyebrow">QUICK ADD</div>
          <h2>すぐに記録</h2>
        </div>
      </div>
      <div class="quick-tabs">
        <button class="tab active" data-target="todo">＋ TODO</button>
        <button class="tab" data-target="money">＋ MONEY</button>
        <button class="tab" data-target="later">＋ LATER</button>
      </div>
      <p class="muted small">種類を選んで、すぐに入力。</p>
    </section>

    <section id="todo" class="panel">
      <div class="section-head">
        <div>
          <div class="eyebrow">01 / TASK MANAGEMENT</div>
          <h2>TODO</h2>
        </div>
        <span class="count" id="todoCount">0 TASKS</span>
      </div>

      <form id="todoForm" class="todo-form">
        <input id="todoTitle" placeholder="何をする？" required maxlength="120">

        <div class="form-row">
          <select id="todoGenre" aria-label="ジャンル">
            <option>仕事</option>
            <option>生活</option>
            <option>個人</option>
            <option>その他</option>
          </select>

          <input id="todoDue" type="date" aria-label="期日" required>
        </div>

        <div class="weight-row">
          <span class="muted small">重さ・警告タイミング</span>
          <div class="weight-options">
            <label><input type="radio" name="weight" value="light"> 軽</label>
            <label><input type="radio" name="weight" value="normal" checked> 普</label>
            <label><input type="radio" name="weight" value="heavy"> 重</label>
          </div>
        </div>

        <button class="primary" type="submit">＋ 追加</button>
      </form>

      <div class="timeline-label">ACTIVE TASKS</div>
      <div id="todoList" class="todo-list"></div>

      <div class="section-head completed-head">
        <h3>COMPLETED</h3>
        <span id="completedCount" class="muted small">0</span>
      </div>
      <div id="completedList" class="todo-list"></div>
    </section>

    <section id="money" class="panel">
      <div class="eyebrow">02 / FINANCE</div>
      <h2>MONEY</h2>
      <p class="muted">これは簡易記録。実際の銀行残高とは連動しません。</p>
      <div class="money-grid">
        <div class="metric">
          <span class="muted small">今月の予算</span>
          <strong id="budgetView">¥100,000</strong>
        </div>
        <div class="metric">
          <span class="muted small">今月の支出</span>
          <strong id="spentView">¥0</strong>
        </div>
        <div class="metric">
          <span class="muted small">残り予算</span>
          <strong id="remainingView">¥100,000</strong>
        </div>
      </div>
      <form id="moneyForm" class="inline-form">
        <input id="moneyAmount" type="number" min="1" step="1" placeholder="支出額（円）" required>
        <button class="primary" type="submit">記録</button>
      </form>
      <div id="moneyList" class="record-list"></div>
    </section>

    <section id="later" class="panel">
      <div class="eyebrow">03 / SAVE FOR LATER</div>
      <h2>LATER</h2>
      <form id="laterForm" class="later-form">
        <input id="laterTitle" placeholder="タイトル（任意）">
        <input id="laterUrl" type="url" placeholder="URL（https://...）">
        <textarea id="laterNote" rows="2" placeholder="メモ（任意）"></textarea>
        <button class="primary" type="submit">＋ 保存</button>
      </form>
      <div id="laterList" class="later-list"></div>
    </section>
  </main>

  <footer>PERSONAL OS · SAVED IN THIS BROWSER</footer>
  <script src="app.js"></script>
</body>
</html>
